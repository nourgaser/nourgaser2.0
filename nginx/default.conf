server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Canonical host redirects.
  if ($host = www.nourgaser.com) {
    return 301 https://nourgaser.com$request_uri;
  }

  # Gzip compression for text-based responses.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml;

  # Keep HTML fresh while still cache-aware.
  location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri =404;
  }

  # Fingerprinted Astro assets can be cached aggressively.
  location ^~ /_astro/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Cache static assets for returning visitors.
  location ~* \.(?:avif|webp|png|jpg|jpeg|gif|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  location ~* \.(?:woff2?|ttf|otf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Real HTTP redirects for retired routes, so search engines and old
  # bookmarks get an instant 301 instead of the noindex meta-refresh page
  # Astro emits at build time. Remove the matching block here if a route
  # is ever brought back as real content.
  location = /skills { return 301 /portfolio; }
  location = /skills/ { return 301 /portfolio; }
  location = /projects { return 301 /portfolio; }
  location = /projects/ { return 301 /portfolio; }
  location = /blog { return 301 /; }
  location = /blog/ { return 301 /; }

  location / {
    # This is a static multi-page site, not an SPA: unmatched paths must
    # 404, not silently fall back to index.html (which was masking every
    # broken/removed URL as a 200 OK homepage response).
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
