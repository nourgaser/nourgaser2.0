<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="'Ubuntu Mono', monospace">
  <defs>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f9a"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3e3"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="750" fill="#0a0b12"/>

  <!-- title -->
  <text x="60" y="50" font-size="26" font-weight="700" fill="#f2f3f6">nourgaser.com — two-layer architecture</text>
  <text x="60" y="76" font-size="14" fill="#8a8f9a">Astro renders the canonical site. ngxos is an optional client runtime layered on top, through one explicit contract.</text>

  <!-- ================= ngxos runtime layer (top, rounded + glow) ================= -->
  <rect x="140" y="100" width="920" height="190" rx="18" fill="#15132a" stroke="#7c5fd0" stroke-width="2" filter="url(#glowCyan)"/>
  <text x="170" y="138" font-size="19" font-weight="700" fill="#22d3e3">ngxos runtime layer (Svelte islands)</text>
  <text x="170" y="160" font-size="14" fill="#b9a8e0">ON = terminal + keyboard nav + neon frames + themes</text>

  <!-- ngxos chips -->
  <g>
    <rect x="170" y="182" width="200" height="80" rx="10" fill="#1b1830" stroke="#22d3e3" stroke-width="1.5"/>
    <text x="190" y="210" font-size="14" font-weight="700" fill="#e7fbff">Terminal</text>
    <text x="190" y="230" font-size="13" fill="#a9b3c9">zsh-like completion</text>
    <text x="190" y="248" font-size="13" fill="#a9b3c9">+ TerminalIO iface</text>

    <rect x="390" y="182" width="200" height="80" rx="10" fill="#1b1830" stroke="#22d3e3" stroke-width="1.5"/>
    <text x="410" y="210" font-size="14" font-weight="700" fill="#e7fbff">Vimium nav</text>
    <text x="410" y="230" font-size="13" fill="#a9b3c9">j / k / gg / G</text>
    <text x="410" y="248" font-size="13" fill="#a9b3c9">f = link hints</text>

    <rect x="610" y="182" width="200" height="80" rx="10" fill="#1b1830" stroke="#7c5fd0" stroke-width="1.5"/>
    <text x="630" y="210" font-size="14" font-weight="700" fill="#e7fbff">Theme engine</text>
    <text x="630" y="230" font-size="13" fill="#a9b3c9">4 themes, live</text>
    <text x="630" y="248" font-size="13" fill="#a9b3c9">switch + persist</text>

    <rect x="830" y="182" width="200" height="80" rx="10" fill="#1b1830" stroke="#c4537c" stroke-width="1.5"/>
    <text x="850" y="210" font-size="14" font-weight="700" fill="#e7fbff">Neon frames</text>
    <text x="850" y="230" font-size="13" fill="#a9b3c9">traveling conic-</text>
    <text x="850" y="248" font-size="13" fill="#a9b3c9">gradient ring</text>
  </g>

  <!-- connector: ngxos -> contract -->
  <line x1="300" y1="290" x2="300" y2="318" stroke="#22d3e3" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="900" y1="290" x2="900" y2="318" stroke="#22d3e3" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- ================= hook contract bridge (middle, neutral) ================= -->
  <rect x="140" y="320" width="920" height="160" rx="6" fill="#141420" stroke="#caa06a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="348" font-size="16" font-weight="700" fill="#e8c98a" text-anchor="middle">data-ngx-* hook contract — the ONLY interface between layers</text>

  <text x="180" y="378" font-size="14" fill="#6fe4f0">data-ngx-section / -label / -route</text>
  <text x="620" y="378" font-size="13" fill="#9aa0aa">nav id, label, route — authored by Astro</text>

  <text x="180" y="401" font-size="14" fill="#6fe4f0">data-ngx-frame</text>
  <text x="620" y="401" font-size="13" fill="#9aa0aa">opts a leaf card into the neon ring</text>

  <text x="180" y="424" font-size="14" fill="#6fe4f0">data-ngx-focused="true"</text>
  <text x="620" y="424" font-size="13" fill="#9aa0aa">set on the active section, by ngxos</text>

  <text x="180" y="447" font-size="14" fill="#6fe4f0">data-ngxos="on" + data-theme on &lt;html&gt;</text>
  <text x="620" y="447" font-size="13" fill="#9aa0aa">power state + active theme</text>

  <text x="180" y="470" font-size="14" fill="#6fe4f0">ngxos:content-swapped (event)</text>
  <text x="620" y="470" font-size="13" fill="#9aa0aa">fired after any in-place DOM swap</text>

  <!-- connector: contract -> base -->
  <line x1="300" y1="480" x2="300" y2="508" stroke="#8a8f9a" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="900" y1="480" x2="900" y2="508" stroke="#8a8f9a" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- ================= Astro base layer (bottom, sharp, muted) ================= -->
  <rect x="140" y="510" width="920" height="190" rx="0" fill="#17181f" stroke="#5a5e68" stroke-width="2"/>
  <text x="170" y="548" font-size="19" font-weight="700" fill="#caa06a">Astro base site — Layer 1</text>
  <text x="170" y="570" font-size="14" fill="#9aa0aa">OFF = plain site, fully usable with JavaScript disabled</text>

  <!-- base chips -->
  <g>
    <rect x="170" y="592" width="200" height="78" rx="0" fill="#1d1e26" stroke="#52565f" stroke-width="1.5"/>
    <text x="190" y="618" font-size="14" font-weight="700" fill="#e4e6ea">Pages &amp; routing</text>
    <text x="190" y="638" font-size="13" fill="#9098a5">file-based Astro</text>
    <text x="190" y="655" font-size="13" fill="#9098a5">routes</text>

    <rect x="390" y="592" width="200" height="78" rx="0" fill="#1d1e26" stroke="#52565f" stroke-width="1.5"/>
    <text x="410" y="618" font-size="14" font-weight="700" fill="#e4e6ea">Content collections</text>
    <text x="410" y="638" font-size="13" fill="#9098a5">typed MDX —</text>
    <text x="410" y="655" font-size="13" fill="#9098a5">projects, blog</text>

    <rect x="610" y="592" width="200" height="78" rx="0" fill="#1d1e26" stroke="#52565f" stroke-width="1.5"/>
    <text x="630" y="618" font-size="14" font-weight="700" fill="#e4e6ea">Zero client JS</text>
    <text x="630" y="638" font-size="13" fill="#9098a5">HTML + CSS only,</text>
    <text x="630" y="655" font-size="13" fill="#9098a5">by default</text>

    <rect x="830" y="592" width="200" height="78" rx="0" fill="#1d1e26" stroke="#52565f" stroke-width="1.5"/>
    <text x="850" y="618" font-size="14" font-weight="700" fill="#e4e6ea">SEO / semantic</text>
    <text x="850" y="638" font-size="13" fill="#9098a5">indexable, works</text>
    <text x="850" y="655" font-size="13" fill="#9098a5">without ngxos</text>
  </g>

  <!-- legend -->
  <rect x="140" y="718" width="16" height="16" rx="0" fill="none" stroke="#8a8f9a" stroke-width="1.5"/>
  <text x="164" y="731" font-size="13" fill="#8a8f9a">sharp = base-site element</text>

  <rect x="430" y="718" width="16" height="16" rx="5" fill="none" stroke="#22d3e3" stroke-width="1.5"/>
  <text x="454" y="731" font-size="13" fill="#8a8f9a">rounded + glow = ngxos element</text>
</svg>
